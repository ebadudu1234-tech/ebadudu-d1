<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBADUDU — Zihe Wang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono&family=Margarine&family=Metrophobic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="intro-on">

<nav class="nav">
  <a class="logo" href="index.html">EBADUDU</a>
  <ul>
    <li><a href="work.html">WORK</a></li>
    <li><a href="#">PLAY AREA</a></li>
    <li><a href="about.html">ABOUT ME</a></li>
  </ul>
</nav>

<!-- Begin animation: Hello World → strike → frog + "Hi, I'm Zihe." -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="stage">
    <div class="hello" id="hello">
      <span id="hello-text"></span><span class="caret"></span>
      <i class="strike"></i>
      <img class="frog" id="frog" src="assets/frog.png" alt="">
    </div>
    <div class="hi-wrap" id="hi-wrap">
      <span class="hi" id="hi">Hi, I'm Zihe.</span>
    </div>
  </div>
  <span class="skip">click to skip</span>
</div>

<main class="page">
  <h1 class="headline">
    <!-- data-piece: where each piece of the intro's "Hi, I'm Zihe." lands; .extra grows in after -->
    <span class="line"><span class="reveal"><span data-piece="hi">Hi</span><span class="extra">iiiiii</span><span data-piece="comma">,</span></span></span>
    <span class="line"><span class="reveal" style="--d:.08s"><span data-piece="name">I'm Zihe</span><span class="extra"> Wang</span></span></span>
  </h1>

  <!-- filled from FEATURED in data.js: small · large / large · small -->
  <section class="grid" id="featured"></section>
</main>

<!-- Ending: "Get in touch" — the frog rises as you scroll in -->
<section class="contact" id="contact">
  <div class="contact-photo" aria-hidden="true"><img src="assets/frog-photo.jpg" alt=""></div>
  <p class="contact-text reveal">
    <span class="label">Get in touch</span>
    <a href="mailto:ebadudu1234@gmail.com">ebadudu1234@gmail.com</a>
  </p>
</section>

<script src="media.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
